[package]
name = "chatgpt-rust-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, lightweight native macOS chat client for your ChatGPT plan, written in Rust."
repository = "https://github.com/syrymuly/chatgpt-rust-client"
publish = false

[dependencies]
base64 = "0.23.1"
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
taffy = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
