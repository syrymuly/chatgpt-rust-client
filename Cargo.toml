[package]
name = "chatgpt-rust-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, lightweight native macOS chat client for your ChatGPT plan, written in Rust."
repository = "https://github.com/syrymuly/chatgpt-rust-client"
publish = false

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
rsa = { version = "0.9", features = ["sha2"] }
security-framework = "3.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
smol = "2"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }
url = "2"
uuid = { version = "1.29.1", features = ["v7"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
taffy = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
